services:
  scandeck:
    image: ghcr.io/dersumo/scandeck:latest
    container_name: scandeck
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./scans:/scans
    environment:
      APP_DATA_DIR: /data
      SCAN_OUTPUT_DIR: /scans

      # Optional: Dateien einem Host-Benutzer zuordnen (id -u / id -g)
      # PUID: 1000
      # PGID: 1000

      # Optional: Einrichtungsassistent vorbelegen
      # SCANNER_URL: https://10.0.0.31:443
      # DISCOVERY_SUBNET: 10.0.0.0/24
      # PAPERLESS_URL: http://paperless:8000
      # PAPERLESS_TOKEN: dein-token
